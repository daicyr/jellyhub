# Stockage local : conserver PostgreSQL sur ce nœud.
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: postgresdb
    type: local
  name: postgresdb-prod-persistent-volume
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 8Gi
  claimRef:
    name: db-persistent-volume-claim
    namespace: jellyhub-prod
  hostPath:
    path: /data/jellyhub-prod/db
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
