apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyhub
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jellyhub
  template:
    metadata:
      labels:
        app: jellyhub
    spec:
      containers:
        - name: jellyhub
          image: zigleur/jellyhub:latest
          ports:
            - containerPort: 3000
