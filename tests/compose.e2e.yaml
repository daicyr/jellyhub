name: jellyhub-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jellyhub_e2e
      POSTGRES_PASSWORD: jellyhub_e2e
      POSTGRES_DB: jellyhub_e2e
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyhub_e2e -d jellyhub_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
